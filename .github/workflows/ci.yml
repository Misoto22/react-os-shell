name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt-in to Node 24 for JavaScript actions so the runner stops warning about
# the upcoming Node 20 deprecation (Sep 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Harness CI-6 — least privilege. This workflow only reads the tree; nothing
# in it needs a writable token, and an undeclared `permissions:` inherits
# whatever the repository default is rather than saying so.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Walks the `exports` map rather than a hard-coded file list, so a new
      # subpath cannot ship unverified, and asserts that dist/ui/index.js
      # reaches no optional peer — the check that catches leakage arriving
      # through a shared chunk, which no source-level test can see.
      - name: Verify dist artifacts
        run: node scripts/verify-dist.mjs

  # The admin portal runs this package on React 19 in production, while the
  # devDependency (and the matrix above) is React 18. The peer range says
  # `>=18`, so this lane is what makes that a tested promise instead of a
  # hopeful one: same specs, React 19 installed over the lockfile. Runtime
  # compatibility only — typecheck stays on the 18 types the repo pins.
  react-19:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install React 19
        run: npm install --no-save react@19 react-dom@19

      - name: Test under React 19
        run: npm test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test real Headless UI integration
        run: npm run test:browser
