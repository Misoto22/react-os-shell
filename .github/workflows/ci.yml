name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt-in to Node 24 for JavaScript actions so the runner stops warning about
# the upcoming Node 20 deprecation (Sep 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Walks the `exports` map rather than a hard-coded file list, so a new
      # subpath cannot ship unverified, and asserts that dist/ui/index.js
      # reaches no optional peer — the check that catches leakage arriving
      # through a shared chunk, which no source-level test can see.
      - name: Verify dist artifacts
        run: node scripts/verify-dist.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test real Headless UI integration
        run: npm run test:browser
