# Harness drift gate — identical in every consumer repo (distributed from
# efficient-harness templates/harness.yml).
#
# Threat model, honestly stated:
#  * Without HARNESS_READ_TOKEN this gate is SELF-CONSISTENT only — it
#    catches the real-world failure mode (accidental hand-edits to
#    .harness/ or the managed .gitignore block, which never recompute the
#    MANIFEST) but NOT a deliberate edit that also recomputes MANIFEST.
#  * With the org secret HARNESS_READ_TOKEN (read-only contents PAT for
#    Efficient-Pty-Ltd/efficient-harness) the second step authenticates
#    the MANIFEST against the actual upstream release, closing that hole.
name: Harness
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  drift:
    name: Harness drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Self-consistency (tree + gitignore block match MANIFEST)
        run: sh .harness/check-drift.sh
      - name: Upstream anchor available?
        id: anchor
        run: echo "have=${{ secrets.HARNESS_READ_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Authenticate MANIFEST against upstream release
        if: steps.anchor.outputs.have == 'true'
        env:
          TOKEN: ${{ secrets.HARNESS_READ_TOKEN }}
        run: |
          set -eu
          ver=$(sed -n 's/^version: //p' .harness/MANIFEST)
          git clone -q --depth 1 --branch "$ver" \
            "https://x-access-token:${TOKEN}@github.com/Efficient-Pty-Ltd/efficient-harness" /tmp/upstream
          mkdir -p /tmp/expected
          sh /tmp/upstream/scripts/sync.sh /tmp/expected >/dev/null
          exp=$(sed -n 's/^tree_sha256: //p' /tmp/expected/.harness/MANIFEST)
          got=$(sed -n 's/^tree_sha256: //p' .harness/MANIFEST)
          if [ "$exp" != "$got" ]; then
            echo "FAIL: .harness/MANIFEST does not match upstream $ver"
            echo "  upstream: $exp"
            echo "  vendored: $got"
            exit 1
          fi
          echo "OK: MANIFEST authenticated against upstream $ver"
